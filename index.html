<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Qarz Nazorati</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="myIframe" src=""></iframe>

  <script>
    window.addEventListener("DOMContentLoaded", function() {
      const baseUrl = "https://script.google.com/macros/s/AKfycbxOxLeYqVkfOJ2bB_PbA2pEYx7FwhuZNDkwsCYgZCxvAi6C2GwAvaR8o_WtAmgrzjKsRQ/exec";
      
      const params = new URLSearchParams(window.location.search);
      const page = params.get("page");
      
      let finalUrl = baseUrl;
      if (page) {
        finalUrl += "?page=" + encodeURIComponent(page);
      }
      
      document.getElementById("myIframe").src = finalUrl;
    });
  </script>
</body>
</html>
